<head>
  <meta charset="utf-8">
  <title>TabTimer</title>
  <meta name="author" content="Yoav Dim">
  <meta name="application-name" content="Tab-Timer">
  <meta name="description" content="A small & unintrusive bidirectional timer web-app which show its value in the tab title.">
  <meta name="keywords" content="Timer,Stopper,counter,stopwatch,clock,countdown,tab,dark mode,online,free">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--link rel="stylesheet" href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css"/-->
  <meta name="theme-color" content="rgb(80,0,255)">
  <link rel="icon" type="image/png" href="clock_512.png" sizes="512x512">
  <link rel="icon" type="image/png" href="clock_192.png" sizes="192x192">
  <link rel="icon" type="image/png" href="clock_144.png" sizes="144x144">
  <link rel="icon" type="image/png" href="clock_120.png" sizes="120x120">
  <link rel="icon" type="image/png" href="clock_100.png" sizes="100x100">
  <link rel="icon" type="image/png" href="clock_16.png" sizes="16x16">
  <link rel="icon" type="image/png" href="clock_32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="clock_48.png" sizes="48x48">
  <link rel="icon" type="image/png" href="clock_96.png" sizes="96x96">
  <link rel="stylesheet" href="TabTimer.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="msapplication-TileColor" content="#ffffff">
</head>

<body id="body-id" no-float="true">
  <div id="top-bar">
    <i class="material-icons top-item" id="hamburger" onclick="toggle_side_menu()">menu</i>
    <a class="material-icons top-item" id="home-logo" href="/">home</a>
    <span id="top-logo" class="top-item">Tab-Timer</span>
    <span id="top-right-btns">
      <i class="material-icons top-item top-btn" id="help-btn">help_outline</i>
      <i class="material-icons top-item top-btn" id="info-btn">info_outline</i>
    </span>
  </div>

  <div id="side-menu" checked="false">
      <br/>
      <input id="check-dark" type="checkbox" onchange="syncDark()">Dark Mode</input>
      <br/>
      <input id="check-black" type="checkbox" onchange="syncBlack()">True Black</input>
      <hr/>
      <input id="sw_rng" type="checkbox">Alarm when zero</input><br/>
      <input id="noise"type="checkbox">Mute</input>
      <hr/>
      <input type="checkbox">ignore seconds</input><br/>
      <input type="checkbox" title="also includes the current value in the 'Total' field">log with current</input><br/>
      <input type="checkbox">use days</input>
      <hr/>
      <input id="check-log" type="checkbox" onchange="syncLog()">Hide Log</input><br/>
      <input id="check-float" type="checkbox" onchange="syncFloat()" checked>Hide circles</input>
      <hr/>
      <i class="material-icons">home</i>
      <i class="material-icons">share</i>
      <a class="material-icons" href="mailto://yoavdim.developer@gmail.com" target="_blank">mail</a>
      <i class="material-icons">person</i>
      <i class="material-icons" title="Copyright &copy; 2018  Yoav Dim, All Rights Reserved.">copyright</i>

  </div>
  <script>
    function toggle_side_menu(){
      if(document.getElementById('side-menu').getAttribute("checked") == "true"){
        document.getElementById('side-menu').setAttribute("checked","false");
      } else {
        document.getElementById('side-menu').setAttribute("checked","true");
      }
    }
    function close_side_menu(){
      document.getElementById('side-menu').setAttribute("checked","false");
    }
    function syncDark(){
      if(document.getElementById('check-dark').checked){
        document.getElementById('body-id').setAttribute("dark","true");
      } else {
        document.getElementById('body-id').removeAttribute("dark");
      }
    }
    function syncBlack(){
      if(document.getElementById('check-black').checked){
        document.getElementById('body-id').setAttribute("true-black","true");
      } else {
        document.getElementById('body-id').removeAttribute("true-black");
      }
    }
    function syncLog(){
      if(document.getElementById('check-log').checked){
        document.getElementById('body-id').setAttribute("no-log","true");
      } else {
        document.getElementById('body-id').removeAttribute("no-log");
      }
    }
    function syncFloat(){
      if(document.getElementById('check-float').checked){
        document.getElementById('body-id').setAttribute("no-float","true");
      } else {
        document.getElementById('body-id').removeAttribute("no-float");
      }
    }
  </script>
  <div id="fixed-buttons-tray">
    <button  onclick="window.open('./index.html')" target="_blank" id="btn-plus" class="float-btn"><i class="material-icons" title="new tab">add</i></button>
  </div>
  <main id="content" onclick="close_side_menu()">
    <div id="inner-content">

      <div id="main-card-wrapper" class="card-wrapper">
        <div id="main-card" class="card">
          <div id="clock-tray" class="card-header">
            <span id=info-tray>
              <i id="frz-info" class="info-icon material-icons">ac_unit</i>
              <span id="dir-info">
                <i id="info-icon-up" class="info-icon material-icons">arrow_upward</i>
                <i id="info-icon-down" class="info-icon material-icons">arrow_downward</i>
              </span>
            </span>
            <button id="big-button" aria-label="Pause or Play">
              <!--img id="big-img" src="https://material.io/tools/icons/static/icons/outline-pause-24px.svg" alt="pause"-->
              <svg id="pause-svg" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="24px"
              	 height="24px" viewBox="0 0 24 24" enable-background="new 0 0 24 24" xml:space="preserve">
              <g id="Bounding_Boxes">
              	<path fill="none" d="M0,0h24v24H0V0z"/>
              </g>
              <g id="Outline">
              	<g id="ui_x5F_spec_x5F_header">
              	</g>
              	<path d="M6,19h4V5H6V19z M14,5v14h4V5H14z"/>
              </g>
              </svg>
              <svg id="play-svg" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                  <path d="M0 0h24v24H0z" fill="none"/>
              </svg>
            </button><!--
          --><span id="display"><span id="inner-display">00:00:00</span></span>
          </div>
          <!--script>
              var running = true;
              function click_big(){ // temp function for theme creation
                running = ! running;
                if(running) {
                  document.getElementById("pause-svg").setAttribute("style","");
                  document.getElementById("play-svg").setAttribute("style","display:none;");
                } else {
                  document.getElementById("pause-svg").setAttribute("style","display:none;");
                  document.getElementById("play-svg").setAttribute("style","");
                }
              }
          </script-->
          <div id="main-content" class="card-content">
            <div id="buttons-tray">
      		    <button id="z"   class="icon-btn" title="set the counter back at zero" ><i class="icon material-icons">exposure_zero</i></button> <!-- set the counter back at zero -->
      		    <button id="f"   class="icon-btn" title="change the direction of counting"><i class="icon material-icons">shuffle</i></button> <!-- change the direction of counting-->
              <button id="res" class="icon-btn" title="reset the state to the last set-up"><i class="material-icons">replay</i></button> <!-- reset the operation to the last set-up -->
      		    <button id="frz" class="icon-btn" title="the time continue but the display is frozen"><i class="icon material-icons">ac_unit</i></button> <!-- the time continue but the display is frozen -->
      		    <button id="clk" class="icon-btn" title="change clock/timer view"><i class="icon material-icons">access_time</i></button>
            </div>
            <div id="buttons-tray2" hide> <!-- TODO: eliminate into a single btn + options -->
              <button id="ag" title="reset the state to the last direction reset">reset round</button> <!-- reset the operation to the last direction reset-->
          		<button id="full_res" title="return to the original state">full reset</button> <!-- reset the operation to the original ones -->
          		<button id="winter_res" title="reset the value to the frozen one">ice reset</button> <!-- reset the value to the frozen one -->
            </div>
            <br />
          	<div id="setup-tray">
          		<button id="set-setup" class="set-btn">set</button>
          		<input type="text" id="set-box" contenteditable="true" />
          		<button id="add-setup" class="set-btn"><i class="icon material-icons">add</i></button>
              <button id="sub-setup" class="set-btn"><i class="icon material-icons">remove</i></button>
          	</div>
          </div>
        </div>
      </div>

      <br/>

      <div id="log-card-wrapper" class="card-wrapper">
        <div id="log-card" class="card">
          <span id="btn-scroll-wrap"><button id="btn-scroll" class="float-btn"><i class="material-icons" title="scroll up">keyboard_arrow_up</i></button></span>
          <div id="log-top" class="card-header">
            <span id="log-logo">Log:</span>
            <span id="log-info"> <!-- the "value" atrribute in miliseconds -->
              <span id="log-last" class="info">Last:  <span class="log-value" value="NaN">none</span></span>
              <span id="log-total" class="info">Total: <span class="log-value" value="0">0</span></span>
              <span id="log-count" class="info">Count: <span class="log-value" value="0">0</span></span>
            </span>
          </div>
          <details id="log-body" class="card-content" > <!-- TODO: "log-tray" & "log-top" should be sticky -->
            <summary id="log-tray" class="card-main-content">
              <span id="log-tray-btns">
                <button id="log-clear-btn" class="text-btn" title="empty the DB">clear</button>
                <button id="log-pop-btn" class="text-btn" title="set the value to the last logged one and remove it from the log">pop</button>
                <button id="log-lap-btn" class="text-btn" title="log & set the value to zero">lap</button>
                <button id="log-add-btn" class="text-btn" title="log a new entry">add</button>
              </span>
            </summary>
            <div id="log-content" class="card-sub-content">
              <!-- TODO -->
              <template id="list_template">
                <tr class="log-entry log-line">
                  <td class="log-value log-entry-value" value="0">00:00</td> <td class="at">@</td> <td class="log-time log-entry-time">hh:mm:ss</td>
                  <td class="log-entry-actions">
                    <button class="entry-remove-btn entry-btn" title="remove entry"></button>
                    <button class="entry-set-btn entry-btn" title="set the entry's value"></button>
                  </td>
                </tr>
              </template>
              <table id="log-table">
                <colgroup>
                  <col id="col-values"/>
                  <col id="col-at"/>
                  <col id="col-times"/>
                  <col id="col-btns"/>
                </colgroup>
                <!-- Entries Come Here: -->

              </table>
            </div>
          </details>
        </div>
      </div>

      <br/>
    </main>
  </div>




<script src="./TabScript.js"></script>
</body>
</html>
